name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: [ubuntu-latest, self-hosted, ostad-runner]

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Node.js version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test
